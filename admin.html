<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Click Bazar - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff9900;
      margin-bottom: 25px;
    }

    .box {
      background: #1d1d1d;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #292929;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn,
    .save-btn {
      background: #ff9900;
      color: #111;
    }

    .logout-btn {
      background: #d33;
      color: white;
    }

    .edit-btn {
      background: #2196f3;
      color: white;
      width: auto;
      padding: 8px 14px;
    }

    .delete-btn {
      background: #e53935;
      color: white;
      width: auto;
      padding: 8px 14px;
      margin-left: 5px;
    }

    .product {
      background: #252525;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .product img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffb300;
    }

    .price {
      color: #00e676;
      font-weight: bold;
      margin: 8px 0;
    }

    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #164d25;
      color: #8cff9b;
    }

    .error {
      display: block;
      background: #551b1b;
      color: #ff8d8d;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      margin: 10px 0;
    }

    .upload-btn {
      background: #673ab7;
      color: white;
    }

    .user-info {
      text-align: center;
      margin-bottom: 15px;
      color: #bbb;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
    }

    #loginBox {
      display: block;
    }

    .loading {
      text-align: center;
      color: #ff9900;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 CLICK BAZAR</h1>

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <div class="box">

      <div class="user-info" id="userInfo"></div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>


    <!-- ADD / EDIT PRODUCT -->
    <div class="box">

      <h2 id="formTitle">➕ Add Product</h2>

      <input
        type="text"
        id="title"
        placeholder="Product Name"
      >

      <input
        type="text"
        id="price"
        placeholder="Price जैसे ₹499"
      >

      <textarea
        id="description"
        placeholder="Product Description"
      ></textarea>


      <input
        type="url"
        id="amazonLink"
        placeholder="Amazon Affiliate Link"
      >


      <h3>📷 Product Photo</h3>

      <input
        type="file"
        id="imageFile"
        accept="image/*"
      >

      <img
        id="imagePreview"
        class="preview"
        alt="Preview"
      >

      <button
        class="upload-btn"
        id="uploadBtn"
      >
        📤 Upload Photo
      </button>

      <div id="uploadStatus" class="status"></div>


      <!-- Hidden Image URL -->
      <input
        type="hidden"
        id="imageUrl"
      >


      <button
        class="save-btn"
        id="saveBtn"
      >
        💾 Add Product
      </button>

      <button
        id="cancelEditBtn"
        style="display:none;background:#555;color:white;"
      >
        Cancel Edit
      </button>

      <div id="saveStatus" class="status"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="box">

      <h2>📦 Products</h2>

      <div id="productsList">
        <div class="loading">
          Loading products...
        </div>
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    db,
    auth
  } from "./firebase.js";


  import {
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  /* =========================
     CLOUDINARY SETTINGS
  ========================= */

  const CLOUD_NAME = "cghzw4pv";

  const UPLOAD_PRESET = "clickbazar";


  /* =========================
     ELEMENTS
  ========================= */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginStatus =
    document.getElementById("loginStatus");

  const userInfo =
    document.getElementById("userInfo");

  const imageFile =
    document.getElementById("imageFile");

  const imagePreview =
    document.getElementById("imagePreview");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const imageUrl =
    document.getElementById("imageUrl");

  const saveBtn =
    document.getElementById("saveBtn");

  const saveStatus =
    document.getElementById("saveStatus");

  const productsList =
    document.getElementById("productsList");

  const cancelEditBtn =
    document.getElementById("cancelEditBtn");

  const formTitle =
    document.getElementById("formTitle");


  let editingProductId = null;


  /* =========================
     STATUS FUNCTION
  ========================= */

  function showStatus(element, message, type) {

    element.textContent = message;

    element.className =
      "status " + type;

  }


  /* =========================
     LOGIN
  ========================= */

  loginBtn.addEventListener(
    "click",
    async () => {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;

      if (!email || !password) {

        showStatus(
          loginStatus,
          "Email और Password भरें।",
          "error"
        );

        return;
      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Login हो रहा है...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showStatus(
          loginStatus,
          "Login सफल!",
          "success"
        );

      } catch (error) {

        console.error(error);

        showStatus(
          loginStatus,
          "Login failed: " +
          error.message,
          "error"
        );

      }


      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }
  );


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        loginBox.style.display =
          "none";

        adminPanel.style.display =
          "block";

        userInfo.textContent =
          "Logged in: " +
          user.email;

        await loadProducts();

      } else {

        loginBox.style.display =
          "block";

        adminPanel.style.display =
          "none";

      }

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

    }
  );


  /* =========================
     IMAGE PREVIEW
  ========================= */

  imageFile.addEventListener(
    "change",
    () => {

      const file =
        imageFile.files[0];

      if (!file) {

        imagePreview.style.display =
          "none";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          imagePreview.src =
            event.target.result;

          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


  /* =========================
     CLOUDINARY UPLOAD
  ========================= */

  uploadBtn.addEventListener(
    "click",
    async () => {

      const file =
        imageFile.files[0];


      if (!file) {

        showStatus(
          uploadStatus,
          "पहले Gallery से फोटो चुनें।",
          "error"
        );

        return;
      }


      uploadBtn.disabled = true;

      uploadBtn.textContent =
        "📤 Upload हो रहा है...";


      showStatus(
        uploadStatus,
        "Photo upload हो रही है...",
        "success"
      );


      try {

        const formData =
          new FormData();


        formData.append(
          "file",
          file
        );


        formData.append(
          "upload_preset",
          UPLOAD_PRESET
        );


        const response =
          await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error?.message ||
            "Cloudinary upload failed"
          );

        }


        imageUrl.value =
          data.secure_url;


        showStatus(
          uploadStatus,
          "✅ Photo successfully upload हो गई!",
          "success"
        );


      } catch (error) {

        console.error(error);

        showStatus(
          uploadStatus,
          "❌ Photo upload failed: " +
          error.message,
          "error"
        );

      }


      uploadBtn.disabled = false;

      uploadBtn.textContent =
        "📤 Upload Photo";

    }
  );


  /* =========================
     ADD / UPDATE PRODUCT
  ========================= */

  saveBtn.addEventListener(
    "click",
    async () => {

      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const price =
        document.getElementById(
          "price"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const amazonLink =
        document.getElementById(
          "amazonLink"
        ).value.trim();


      const photo =
        imageUrl.value.trim();


      if (!title) {

        showStatus(
          saveStatus,
          "Product Name डालें।",
          "error"
        );

        return;
      }


      if (!amazonLink) {

        showStatus(
          saveStatus,
          "Amazon Affiliate Link डालें।",
          "error"
        );

        return;
      }


      if (!photo) {

        showStatus(
          saveStatus,
          "पहले Photo Upload करें।",
          "error"
        );

        return;
      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try {

        const productData = {

          title: title,

          price: price,

          description: description,

          amazonLink: amazonLink,

          image: photo,

          updatedAt:
            serverTimestamp()

        };


        if (editingProductId) {

          await updateDoc(
            doc(
              db,
              "products",
              editingProductId
            ),
            productData
          );


          showStatus(
            saveStatus,
            "✅ Product update हो गया!",
            "success"
          );

        } else {

          productData.createdAt =
            serverTimestamp();


          await addDoc(
            collection(
              db,
              "products"
            ),
            productData
          );


          showStatus(
            saveStatus,
            "✅ Product successfully add हो गया!",
            "success"
          );

        }


        clearForm();

        await loadProducts();


      } catch (error) {

        console.error(error);

        showStatus(
          saveStatus,
          "❌ Save failed: " +
          error.message,
          "error"
        );

      }


      saveBtn.disabled = false;

      saveBtn.textContent =
        editingProductId
          ? "💾 Update Product"
          : "💾 Add Product";

    }
  );


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    productsList.innerHTML =
      `<div class="loading">
        Products loading...
      </div>`;


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );


      productsList.innerHTML = "";


      if (snapshot.empty) {

        productsList.innerHTML =
          "<p>अभी कोई product नहीं है।</p>";

        return;
      }


      snapshot.forEach(
        (productDoc) => {

          const product =
            productDoc.data();


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "product";


          const img =
            document.createElement(
              "img"
            );

          img.src =
            product.image || "";

          img.alt =
            product.title || "Product";

          img.onerror =
            () => {
              img.style.display =
                "none";
            };


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "product-title";

          title.textContent =
            product.title || "";


          const price =
            document.createElement(
              "div"
            );

          price.className =
            "price";

          price.textContent =
            product.price || "";


          const desc =
            document.createElement(
              "p"
            );

          desc.textContent =
            product.description || "";


          const editBtn =
            document.createElement(
              "button"
            );

          editBtn.className =
            "edit-btn";

          editBtn.textContent =
            "✏️ Edit";


          const deleteBtn =
            document.createElement(
              "button"
            );

          deleteBtn.className =
            "delete-btn";

          deleteBtn.textContent =
            "🗑️ Delete";


          editBtn.onclick =
            () => {

              editProduct(
                productDoc.id,
                product
              );

            };


          deleteBtn.onclick =
            () => {

              deleteProduct(
                productDoc.id
              );

            };


          div.appendChild(img);

          div.appendChild(title);

          div.appendChild(price);

          div.appendChild(desc);

          div.appendChild(editBtn);

          div.appendChild(deleteBtn);


          productsList.appendChild(
            div
          );

        }
      );


    } catch (error) {

      console.error(error);

      productsList.innerHTML =
        `<p style="color:#ff7777">
          Products load नहीं हो सके।
        </p>`;

    }

  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProduct(
    id,
    product
  ) {

    editingProductId =
      id;


    document.getElementById(
      "title"
    ).value =
      product.title || "";


    document.getElementById(
      "price"
    ).value =
      product.price || "";


    document.getElementById(
      "description"
    ).value =
      product.description || "";


    document.getElementById(
      "amazonLink"
    ).value =
      product.amazonLink || "";


    imageUrl.value =
      product.image || "";


    if (product.image) {

      imagePreview.src =
        product.image;

      imagePreview.style.display =
        "block";

    }


    formTitle.textContent =
      "✏️ Edit Product";


    saveBtn.textContent =
      "💾 Update Product";


    cancelEditBtn.style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(id) {

    const confirmDelete =
      confirm(
        "क्या आप यह product delete करना चाहते हैं?"
      );


    if (!confirmDelete) {

      return;

    }


    try {

      await deleteDoc(
        doc(
          db,
          "products",
          id
        )
      );


      alert(
        "Product delete हो गया।"
      );


      await loadProducts();


    } catch (error) {

      console.error(error);

      alert(
        "Delete failed: " +
        error.message
      );

    }

  }


  /* =========================
     CLEAR FORM
  ========================= */

  function clearForm() {

    editingProductId =
      null;


    document.getElementById(
      "title"
    ).value = "";


    document.getElementById(
      "price"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "amazonLink"
    ).value = "";


    imageFile.value =
      "";


    imageUrl.value =
      "";


    imagePreview.src =
      "";


    imagePreview.style.display =
      "none";


    uploadStatus.className =
      "status";


    saveStatus.className =
      "status";


    formTitle.textContent =
      "➕ Add Product";


    saveBtn.textContent =
      "💾 Add Product";


    cancelEditBtn.style.display =
      "none";

  }


  cancelEditBtn.addEventListener(
    "click",
    clearForm
  );


</script>

</body>
  </html>
